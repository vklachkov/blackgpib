[package]
name = "blackgpib"
version = "2.0.0"
edition = "2024"
default-run = "blackgpib"

[[bin]]
name = "gpib-dump-parser"
path = "src/sniffer/bin/dump_parser.rs"

[dependencies]
bpaf = "0.9.20"
libc = "0.2.177"
memmap2 = "0.9.9"
ringbuf = { version = "0.4.8", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
